<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track Your Booking — AYORA</title>
<meta name="robots" content="noindex">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;600&family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&display=swap" rel="stylesheet">
<style type="text/tailwindcss">
  @theme {
    --color-noir: #0b0d0c;
    --color-noir-soft: #141816;
    --color-jade: #1f6f52;
    --color-gold: #d6b064;
    --color-mist: #e9e6df;
    --font-sans: 'Sora', sans-serif;
    --font-display: 'Fraunces', serif;
  }
</style>
<style>
  html { color-scheme: dark; }
  .field:focus { border-color: rgba(214,176,100,.7); outline: none; box-shadow: 0 0 0 3px rgba(214,176,100,.08); }
  @media (prefers-reduced-motion: no-preference) { .enter { animation: enter .8s cubic-bezier(.16,1,.3,1) both; } @keyframes enter { from { opacity:0; transform:translateY(20px) } } }
</style>
</head>
<body class="min-h-screen bg-noir text-mist font-sans antialiased">
<div class="fixed inset-0 -z-10 overflow-hidden">
  <div class="absolute -top-40 -left-32 h-[38rem] w-[38rem] rounded-full bg-jade/25 blur-[140px]"></div>
  <div class="absolute top-1/3 -right-40 h-[34rem] w-[34rem] rounded-full bg-gold/15 blur-[150px]"></div>
  <div class="absolute inset-0 opacity-[0.06]" style="background-image:radial-gradient(#fff 1px, transparent 1px); background-size:26px 26px"></div>
</div>
<nav class="border-b border-white/5 bg-noir/75 backdrop-blur-xl">
  <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">
    <a href="/concept/noir" target="_top" class="font-display text-2xl tracking-[0.25em] text-gold">AYORA</a>
    <a href="/concept/noir" target="_top" class="text-[10px] uppercase tracking-[0.22em] text-mist/55 transition-colors hover:text-gold">← Back to website</a>
  </div>
</nav>
<main class="px-6 py-12 md:py-20">
  <div class="enter mx-auto max-w-3xl">
    <div class="mb-12 max-w-2xl">
      <p class="text-[10px] uppercase tracking-[0.35em] text-gold/80">Booking status</p>
      <h1 class="mt-5 font-display text-5xl font-light leading-tight md:text-6xl">Track your<br><span class="italic text-gold">booking.</span></h1>
      <p class="mt-6 max-w-xl text-sm leading-relaxed text-mist/55">Enter your booking reference (for example AYR-1029) or the phone number you booked with, and see where your request stands.</p>
    </div>

    <form id="track-form" class="border border-white/10 bg-noir-soft/60 p-6 md:p-9" novalidate>
      <label class="block"><span class="mb-2 block text-[10px] uppercase tracking-[0.2em] text-mist/55">Booking reference or phone number <span class="text-gold">*</span></span><input id="query" type="text" required maxlength="25" placeholder="AYR-1029 or +971 50 123 4567" class="field w-full border border-white/10 bg-noir px-4 py-3.5 text-sm text-mist placeholder:text-mist/25"></label>
      <button id="track-btn" type="submit" class="mt-6 w-full rounded-full bg-gold px-6 py-4 text-sm font-semibold text-noir transition-transform hover:scale-[1.02] disabled:opacity-60 sm:w-auto sm:px-10">Find my booking</button>
      <p id="track-error" class="mt-4 hidden text-xs leading-relaxed text-gold"></p>
    </form>

    <section id="results" class="mt-8 hidden space-y-5" aria-live="polite"></section>
  </div>
</main>
<footer class="border-t border-white/5 px-6 py-8 text-center text-[10px] uppercase tracking-[0.25em] text-mist/35">AYORA — Wellness at your doorstep.</footer>
<script>
  const form = document.getElementById('track-form');
  const btn = document.getElementById('track-btn');
  const errorEl = document.getElementById('track-error');
  const results = document.getElementById('results');

  const STATUS_STYLES = {
    pending:   { label: 'Pending confirmation', cls: 'border-gold/60 text-gold' },
    confirmed: { label: 'Confirmed', cls: 'border-jade/70 text-jade' },
    completed: { label: 'Completed', cls: 'border-white/30 text-mist/70' },
    cancelled: { label: 'Cancelled', cls: 'border-mist/25 text-mist/45' },
  };

  function showError(text) { errorEl.textContent = text; errorEl.classList.remove('hidden'); }
  function hideError() { errorEl.classList.add('hidden'); }

  function card(b) {
    const s = STATUS_STYLES[b.status] || STATUS_STYLES.pending;
    const when = (b.date || '') + (b.time_slot ? ' · ' + b.time_slot : '');
    return '' +
      '<article class="border border-white/10 bg-noir-soft/60 p-6 md:p-8">' +
        '<div class="flex flex-wrap items-center justify-between gap-3">' +
          '<span class="text-[10px] uppercase tracking-[0.25em] text-gold">' + (b.reference || '') + '</span>' +
          '<span class="border px-3 py-1 text-[10px] uppercase tracking-[0.18em] ' + s.cls + '">' + s.label + '</span>' +
        '</div>' +
        '<h2 class="mt-4 font-display text-2xl">' + (b.service || '') + '</h2>' +
        '<p class="mt-1 text-xs text-mist/45">60 minutes · ' + (b.professional || '') + ' professional</p>' +
        '<dl class="mt-6 grid gap-4 border-t border-white/10 pt-5 text-sm sm:grid-cols-2">' +
          '<div><dt class="text-[9px] uppercase tracking-[0.18em] text-mist/35">When</dt><dd class="mt-1 text-mist/80">' + (when || '—') + '</dd></div>' +
          '<div><dt class="text-[9px] uppercase tracking-[0.18em] text-mist/35">Location</dt><dd class="mt-1 text-mist/80">' + (b.location || '—') + '</dd></div>' +
        '</dl>' +
        (b.status === 'pending'
          ? '<p class="mt-5 text-xs leading-relaxed text-mist/40">AYORA will contact you on WhatsApp shortly to confirm this appointment.</p>'
          : b.status === 'confirmed'
            ? '<p class="mt-5 text-xs leading-relaxed text-jade">Your session is confirmed. We look forward to seeing you.</p>'
            : '') +
      '</article>';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();
    const q = document.getElementById('query').value.trim();
    if (!q) { showError('Please enter your booking reference or phone number.'); return; }

    btn.disabled = true; btn.textContent = 'Searching…';
    results.classList.add('hidden');
    try {
      const isRef = /^ayr[-\s]?\d+$/i.test(q) || /^ayr/i.test(q);
      const params = isRef
        ? 'ref=' + encodeURIComponent(q.replace(/\s+/g, '').toUpperCase())
        : 'phone=' + encodeURIComponent(q);
      const res = await fetch('/api/public/bookings/track?' + params);
      const data = await res.json();
      if (!res.ok) { showError(data.error || 'Could not look that up right now.'); return; }
      const list = Array.isArray(data.bookings) ? data.bookings : [];
      if (!list.length) {
        showError('No booking found for that reference or number. Double-check it, or WhatsApp us and we will find it for you.');
        return;
      }
      results.innerHTML = list.map(card).join('');
      results.classList.remove('hidden');
    } catch {
      showError('Could not reach AYORA right now. Please try again in a moment.');
    } finally {
      btn.disabled = false; btn.textContent = 'Find my booking';
    }
  });
</script>
</body>
</html>
